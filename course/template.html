<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="An offline, interactive TLA+ course: state machines, language, model checking, proofs, and distributed architecture studies.">
<title>TLA+ — an interactive course</title>
<style>
/*FONTS*/
/* Layout: sticky top bar; a sidebar (lessons grouped by lecture, a progress strip); one centered reading column. */
:root{color-scheme:light;
 --background:#ffffff;--surface:#f5f7fb;--card:#ffffff;--secondary:#f0f3f9;--secondary-strong:#e2e7f1;
 --foreground:#1b2232;--muted:#596379;--border:#dfe4ee;--border-strong:#c3ccdc;
 --primary:#2350cf;--primary-hover:#1a40ad;--primary-foreground:#ffffff;--accent:#eaf0fd;
 --success:#16774a;--on-success:#ffffff;--destructive:#b3233f;--warning:#865600;
 --code-background:#f5f7fa;--ring:#5a7fe8;--chart-1:#2350cf;--chart-2:#16774a;--chart-3:#b3233f;
 --shadow:0 1px 2px rgb(20 30 60/.05),0 2px 8px rgb(20 30 60/.06);
 --radius:12px;--radius-sm:8px;--top-h:64px;
 --font-sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
 --font-display:"Lexend","Source Sans 3",system-ui,sans-serif;
 --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
 --background:#111623;--surface:#0c111c;--card:#161d2d;--secondary:#1b2335;--secondary-strong:#273149;
 --foreground:#e5e9f2;--muted:#a3adc1;--border:#29334a;--border-strong:#3b4762;
 --primary:#8eaeff;--primary-hover:#b0c6ff;--primary-foreground:#0e1424;--accent:#1d2a4a;
 --success:#6fd3a0;--on-success:#0c1a13;--destructive:#ff8fa5;--warning:#efc46e;
 --code-background:#0d1320;--ring:#8eaeff;--chart-1:#8eaeff;--chart-2:#6fd3a0;--chart-3:#ff8fa5;
 --shadow:0 1px 2px rgb(0 0 0/.3),0 2px 8px rgb(0 0 0/.25)}}
:root[data-theme=dark]{color-scheme:dark;
 --background:#111623;--surface:#0c111c;--card:#161d2d;--secondary:#1b2335;--secondary-strong:#273149;
 --foreground:#e5e9f2;--muted:#a3adc1;--border:#29334a;--border-strong:#3b4762;
 --primary:#8eaeff;--primary-hover:#b0c6ff;--primary-foreground:#0e1424;--accent:#1d2a4a;
 --success:#6fd3a0;--on-success:#0c1a13;--destructive:#ff8fa5;--warning:#efc46e;
 --code-background:#0d1320;--ring:#8eaeff;--chart-1:#8eaeff;--chart-2:#6fd3a0;--chart-3:#ff8fa5;
 --shadow:0 1px 2px rgb(0 0 0/.3),0 2px 8px rgb(0 0 0/.25)}

/* Base */
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:calc(var(--top-h) + 16px)}
body{margin:0;color:var(--foreground);background:var(--surface);font:17px/1.7 var(--font-sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit}a{color:var(--primary);text-underline-offset:3px;text-decoration-thickness:1px}a:hover{color:var(--primary-hover)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
button,select,input[type=search],input[type=number],input[type=text]{border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:7px 14px;color:var(--foreground);background:var(--card)}
button{cursor:pointer;font-weight:600;font-size:15px;line-height:1.4;transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s,transform .15s cubic-bezier(.3,.7,.4,1)}
button:hover{background:var(--secondary);border-color:var(--muted)}button:disabled{opacity:.45;cursor:default}button:disabled:hover{background:var(--card);border-color:var(--border-strong)}
button.primary,.quiz>button,.numcheck button{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
button.primary:hover,.quiz>button:hover,.numcheck button:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.skip{position:absolute;left:12px;top:-90px;z-index:40;background:var(--card);padding:12px;border-radius:var(--radius-sm)}.skip:focus{top:12px}
[hidden]{display:none!important}.js .lesson[hidden]{display:none}.only-print{display:none}.muted{color:var(--muted)}

/* Top bar */
.top{position:sticky;top:0;z-index:30;height:var(--top-h);display:flex;gap:16px;justify-content:space-between;align-items:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(20px,env(safe-area-inset-left,0px));background:var(--card);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;color:var(--foreground);text-decoration:none;min-width:0}.brand:hover{color:var(--foreground)}
.brand-mark{flex:none;display:grid;place-items:center;min-width:44px;height:38px;padding:0 7px;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font:700 14px/1 var(--font-display);letter-spacing:-.03em}
.brand-name{display:flex;flex-direction:column;min-width:0;font:600 17px/1.2 var(--font-display);letter-spacing:-.01em}
.brand-name small{font:400 13px/1.3 var(--font-sans);color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:8px;align-items:center}
.top-actions button{background:transparent;border-color:transparent;color:var(--foreground);padding:7px 12px;font-size:14px}
.top-actions button:hover{background:var(--secondary);border-color:var(--border)}
/* theme switch: the sun's rays fold away and a shadow slides over it to make the moon */
.top-actions .theme-toggle{display:grid;place-items:center;width:40px;height:40px;padding:0;border-radius:10px}
.theme-toggle svg{width:21px;height:21px;overflow:visible}
.theme-sun{transform-origin:12px 12px;transform:scale(.56)}
.theme-cut{transform:translate(10px,-10px)}
.theme-rays{transform-origin:12px 12px}
:root[data-theme=dark] .theme-sun{transform:scale(1)}
:root[data-theme=dark] .theme-cut{transform:none}
:root[data-theme=dark] .theme-rays{transform:rotate(-90deg) scale(.4);opacity:0}
.theme-toggle.ready .theme-sun{transition:transform .5s cubic-bezier(.4,1.6,.5,1)}
.theme-toggle.ready .theme-cut{transition:transform .45s cubic-bezier(.3,.8,.3,1)}
.theme-toggle.ready .theme-rays{transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .3s}

/* Shell */
.shell{display:grid;grid-template-columns:304px minmax(0,1fr);min-height:calc(100vh - var(--top-h))}
.sidebar{position:sticky;top:var(--top-h);align-self:start;height:calc(100vh - var(--top-h));height:calc(100dvh - var(--top-h));min-height:0;display:flex;flex-direction:column;padding:22px 16px 18px 22px;background:var(--surface);border-right:1px solid var(--border)}
.side-head{display:none}
.contents-toggle{display:none}
.sidebar-toggle{flex:none;display:grid;place-items:center;width:38px;height:38px;margin:0 -6px 0 -8px;padding:0;border:0;border-radius:10px;background:transparent;color:var(--muted)}
.sidebar-toggle:hover{background:var(--secondary-strong);color:var(--foreground)}
.sidebar-toggle svg{width:18px;height:18px}
.shell.animate{transition:grid-template-columns .25s cubic-bezier(.2,.8,.2,1)}
/* collapsed (wider than a phone): a narrow rail with the expand button and the progress strip standing upright */
@media(min-width:651px){
 .shell.collapsed{grid-template-columns:58px minmax(0,1fr)}
 .shell.collapsed .sidebar{padding:22px 10px 18px;overflow:hidden}
 .shell.collapsed .lesson-scroll{display:none}
 .shell.collapsed .side-foot{flex:1;flex-direction:column;padding-top:0;border-top:0}
 .shell.collapsed .trace{flex:1;flex-direction:column;width:12px;height:auto}
 .shell.collapsed .trace-part{flex-direction:column;width:100%}
 .shell.collapsed .trace [data-id]{width:6px;height:auto;min-height:1px}
 .shell.collapsed .trace [data-id].current{width:12px}
}

.lesson-scroll{flex:1;min-height:0;margin:0 -8px 0 -10px;padding:0 6px 0 0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--border-strong) transparent}
.lesson-scroll::-webkit-scrollbar{width:8px}
.lesson-scroll::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:8px}
.toc{list-style:none;margin:0;padding:0 0 16px}
.toc .group{margin:22px 0 4px;padding:0 10px;font:600 13px/1.3 var(--font-display);color:var(--muted)}
.toc a{display:flex;align-items:baseline;gap:10px;padding:6px 10px;border-radius:8px;color:var(--foreground);text-decoration:none;font-size:15px;line-height:1.35}
.toc a:hover{background:var(--secondary-strong);color:var(--foreground)}
.toc a[aria-current=page]{background:var(--accent);color:var(--primary);font-weight:600}
.toc-title{flex:1;min-width:0}
.toc .done{flex:none;color:var(--success);font-size:13px;font-weight:700}
.side-foot{flex:none;display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid var(--border)}
.trace{flex:1;min-width:0;display:flex;gap:4px;align-items:center;height:12px}
.trace-part{display:flex;gap:1px;align-items:center;min-width:0}
.trace [data-id]{flex:1;min-width:1px;height:6px;border-radius:1px;background:var(--secondary-strong);cursor:pointer;transition:background-color .2s,height .2s}
.trace [data-id].done{background:var(--success)}
.trace [data-id].current{height:12px;background:var(--primary)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* Lesson */
main{min-width:0;container:main/inline-size;padding:44px max(clamp(16px,3.5vw,56px),env(safe-area-inset-right,0px)) 96px max(clamp(16px,3.5vw,56px),env(safe-area-inset-left,0px));background:var(--background)}
main:focus{outline:none}
/* the reading column grows with main (so it widens when the sidebar collapses) but stops short of the full width */
.lesson{max-width:720px;max-width:clamp(640px,86cqi,960px);margin:auto;font-size:18px}
.chapter{margin:0 0 10px;font:600 14px/1.4 var(--font-sans);color:var(--primary)}
.lesson h1,.lesson h2,.lesson h3{font-family:var(--font-display);text-wrap:balance;color:var(--foreground)}
.lesson h1{font-weight:600;font-size:clamp(30px,3.4vw,40px);line-height:1.18;letter-spacing:-.025em;margin:6px 0 18px}
.lesson h2{font-weight:600;font-size:24px;line-height:1.3;letter-spacing:-.015em;margin:44px 0 12px}
.lesson h3{font-weight:500;font-size:19px;line-height:1.4;margin:30px 0 8px}
.lesson p{margin:14px 0}.lesson ul,.lesson ol{padding-left:24px}.lesson li{margin:8px 0}.lesson li::marker{color:var(--muted)}
.lead{font-size:21px;line-height:1.55;color:var(--foreground)}
.goal{padding:14px 18px;margin:24px 0;background:var(--accent);border-radius:var(--radius)}
.callout{padding:16px 20px;background:var(--accent);border-radius:var(--radius);margin:24px 0}
.callout p:first-child{margin-top:0}.callout p:last-child{margin-bottom:0}
code{font:.86em/1.6 var(--font-mono);font-variant-ligatures:none;overflow-wrap:anywhere;background:var(--secondary);padding:.1em .35em;border-radius:5px}
pre{background:var(--code-background);border:1px solid var(--border);padding:18px 20px;overflow-x:auto;border-radius:var(--radius);margin:20px 0 0;max-width:100%;tab-size:4}
pre code{padding:0;background:none;overflow-wrap:normal;white-space:pre;font-size:13.5px;line-height:1.65}
/* Motion. Buttons press in; the main ones lift on hover; content that arrives fades up.
   Reduced motion switches all of it off (the rule near the end). */
:is(.btn,button.primary,.quiz>button,.numcheck button,.controls button):not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px color-mix(in srgb,var(--foreground) 45%,transparent)}
:is(button,.btn,.quiz>button,.numcheck button,.controls button):not(:disabled):active{transform:scale(.96);box-shadow:none}
.theme-toggle svg,.sidebar-toggle svg{transition:transform .3s cubic-bezier(.3,1.5,.5,1)}
.theme-toggle:hover svg{transform:rotate(-18deg)}
.sidebar-toggle:hover svg{transform:scaleX(-1)}
.toc a{transition:background-color .2s,color .2s}
:is(details.answer,details.hint)[open]>:not(summary){animation:motion-down .3s ease-out}
.lesson:not([hidden]){animation:motion-up .4s cubic-bezier(.2,.7,.3,1)}
.arrive,.pop{animation:motion-up .3s ease-out}
.quiz-feedback.bad.pop{animation:motion-up .3s ease-out,motion-shake .4s ease-in-out}
.video-frame,.video-poster span{transition:transform .2s}.video-poster:hover span{transform:scale(1.05)}
@keyframes motion-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes motion-down{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes motion-shake{0%,100%{translate:0}20%,60%{translate:-4px}40%,80%{translate:4px}}
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
.code-tools{display:flex;justify-content:flex-end;margin:6px 0 20px}
.code-tools button{font-size:13px;font-weight:600;padding:3px 10px;color:var(--muted);background:transparent;border-color:transparent}
.code-tools button:hover{color:var(--foreground);background:var(--secondary)}
figure{margin:32px 0}
figcaption{font-size:15px;line-height:1.55;color:var(--muted);margin-top:12px}
.flow{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:20px 0}
.node{max-width:100%;overflow-wrap:anywhere;background:var(--secondary);padding:14px 18px;min-width:90px;text-align:center;border-radius:var(--radius-sm)}
.node small{display:block;color:var(--muted)}.arrow{color:var(--muted);font-size:22px}.branch{display:grid;gap:12px}.diagram-label{text-align:center;color:var(--muted);font-size:14px}
.table-wrap{overflow-x:auto;margin:22px 0;border:1px solid var(--border);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:15px;line-height:1.5}
.table-wrap table{margin:0}
th,td{text-align:left;vertical-align:top;padding:11px 14px;border-bottom:1px solid var(--border)}
tr:last-child>td{border-bottom:0}
th{font-weight:600;background:var(--surface);font-size:14px}
summary{cursor:pointer}
/* disclosures (answers, hints, solutions): a card whose header row opens with a turning chevron */
:is(details.answer,details.hint){margin:16px 0;padding:0;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
:is(details.answer,details.hint)>summary{display:flex;align-items:center;gap:12px;padding:12px 16px;font-weight:600;cursor:pointer;list-style:none;transition:background-color .2s}
:is(details.answer,details.hint)>summary::-webkit-details-marker{display:none}
:is(details.answer,details.hint)>summary::before{content:"";flex:none;width:7px;height:7px;margin:0 3px 2px 2px;border-right:2px solid var(--primary);border-bottom:2px solid var(--primary);transform:rotate(-45deg);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
:is(details.answer,details.hint)[open]>summary::before{transform:rotate(45deg);margin-bottom:5px}
:is(details.answer,details.hint)>summary:hover{background:var(--secondary)}
:is(details.answer,details.hint)[open]>summary{border-bottom:1px solid var(--border)}
:is(details.answer,details.hint)>:not(summary){margin-left:18px;margin-right:18px}
:is(details.answer,details.hint)>:last-child:not(summary){margin-bottom:16px}
details.hint{background:transparent}details.hint>summary{color:var(--muted)}details.hint>summary::before{border-color:var(--muted)}
details.solution>summary::before{border-color:var(--success)}
.resources{font-size:15px}.resources li{margin:8px 0}

/* Videos */
.videos{margin:28px 0;padding:18px 20px 8px;border-radius:var(--radius);background:var(--surface)}
.lesson .videos h2{margin:0;font-size:17px;letter-spacing:0}
.videos-note{margin:2px 0 8px!important;font-size:14px;color:var(--muted)}
.video{padding:14px 0 10px}.video+.video{border-top:1px solid var(--border)}
.video-head{display:flex;gap:14px;align-items:baseline;margin-top:12px}
.video-text{flex:1;min-width:0}
.video-length{flex:none;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.video-name{display:block;font:600 16px/1.35 var(--font-display)}
.video-meta{display:block;font-size:14px;color:var(--muted)}
.video-about{margin:6px 0 6px!important;font-size:15px}
.video-links{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:center;font-size:14px}
.video-frame{aspect-ratio:16/9;max-width:100%;border-radius:var(--radius-sm);overflow:hidden;background:#000}
.video-frame iframe{display:block;width:100%;height:100%;border:0}
.video-poster{position:relative;display:grid;place-items:center;width:100%;height:100%;color:#fff;text-decoration:none}
.video-poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7;transition:opacity .2s}
.video-poster span{position:relative;padding:10px 20px;border-radius:99px;background:rgba(0,0,0,.72);font-weight:600}
.video-poster:hover{color:#fff}.video-poster:hover img{opacity:.85}

/* Labs */
.lab{border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;margin:32px 0;background:var(--card);box-shadow:var(--shadow)}
.lesson .lab h2{font-size:19px;margin-top:0}
.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.controls button{font-size:14px;padding:6px 12px}
.controls label{min-width:0;max-width:100%;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:15px}
.controls input[type=number]{width:75px}.controls select{min-width:0;max-width:100%}
.readout{font-family:var(--font-mono);font-variant-ligatures:none;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--code-background);border:1px solid var(--border);padding:14px 16px;border-radius:var(--radius-sm);margin:16px 0}
.good{color:var(--success)}.bad{color:var(--destructive)}.status{min-height:28px;font-size:15px}
.lab svg{display:block;width:100%;height:auto;min-height:90px}
.lab svg text{fill:var(--foreground);font:14px var(--font-sans)}
.lab svg .edge{stroke:var(--border-strong);stroke-width:2}.lab svg .vertex{fill:var(--secondary);stroke:var(--border-strong)}
.lab svg .current{fill:var(--accent);stroke:var(--primary);stroke-width:2}.lab svg .failure{fill:var(--secondary);stroke:var(--destructive);stroke-width:3}
.lane{display:grid;grid-template-columns:90px 1fr;gap:10px;margin:10px 0;align-items:center}.lane .track{display:flex;gap:7px;flex-wrap:wrap}
.chip{max-width:100%;overflow-wrap:anywhere;line-height:1.5;padding:5px 10px;background:var(--secondary);border-radius:6px;font:13px var(--font-mono)}
.flash{min-height:160px;display:grid;place-content:center;text-align:center;padding:20px;background:var(--secondary);border-radius:var(--radius)}.flash strong{font-size:20px}.flash p{margin-bottom:0}

/* Quizzes */
.quiz{margin:36px 0 28px;padding-top:22px;border-top:1px solid var(--border)}
.quiz fieldset{border:0;margin:0;padding:0;min-width:0;display:grid;gap:8px}
.quiz legend{font:600 17px/1.45 var(--font-sans);margin-bottom:12px;padding:0}
.quiz label{display:flex;gap:10px;align-items:baseline;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;line-height:1.5;transition:border-color .15s,background-color .15s}
.quiz label:hover{border-color:var(--primary)}
.quiz label:has(input:checked){border-color:var(--primary);background:var(--accent)}
.quiz input{margin:0;flex:none;accent-color:var(--primary);transform:translateY(2px)}
.quiz>button{margin-top:16px}
.quiz-feedback{margin:12px 0 0!important;min-height:0;line-height:1.55}
.quiz-feedback.good,.quiz-feedback.bad{padding:12px 16px;border-radius:var(--radius-sm)}
.quiz-feedback.good{background:color-mix(in srgb,var(--success) 12%,var(--card))}
.quiz-feedback.bad{background:color-mix(in srgb,var(--destructive) 10%,var(--card))}
.quiz-feedback:empty{display:none}

/* Notes and footer */
.lesson-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;border-top:1px solid var(--border);margin-top:28px;padding-top:24px}
.complete{display:inline-flex;gap:10px;align-items:center;min-height:44px;padding:0 20px 0 14px;border:1px solid var(--primary);border-radius:var(--radius-sm);background:var(--primary);color:var(--primary-foreground);font-weight:600;cursor:pointer;user-select:none}
.complete:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.complete:active{transform:scale(.97)}
.complete{transition:background-color .25s,color .25s,border-color .25s,transform .15s}
.complete-mark{position:relative;display:grid;flex:none}
.complete-mark svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.complete.compact{min-height:38px;gap:8px;padding:0 14px 0 10px;font-size:14px}.complete.compact input{width:18px;height:18px}
.complete-mark path{fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:12;stroke-dashoffset:12;transition:stroke-dashoffset .3s ease-out .12s}
.complete:has(input:checked) .complete-mark path{stroke-dashoffset:0}
/* plays once, when the lesson is completed (the class is added on the change event) */
.complete.celebrate{animation:complete-pop .45s cubic-bezier(.3,1.6,.5,1),complete-ring .7s ease-out}
.complete.celebrate .complete-mark input{animation:complete-dot .4s cubic-bezier(.3,1.8,.5,1)}
.complete.celebrate .when-done{animation:complete-text .35s ease-out}
@keyframes complete-pop{0%{transform:scale(.96)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes complete-ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--success) 45%,transparent)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--success) 0%,transparent)}}
@keyframes complete-dot{0%{transform:scale(.5)}100%{transform:scale(1)}}
@keyframes complete-text{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:none}}
.complete input{flex:none;display:grid;color:inherit;width:20px;height:20px;margin:0;border:2px solid currentColor;border-radius:50%;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;transition:background-color .2s,border-color .2s}
.complete input:focus-visible{outline:2px solid var(--ring);outline-offset:3px}
.complete .when-done{display:none}.complete .when-todo,.complete .when-done{transform-origin:left center}
.complete:has(input:checked){background:color-mix(in srgb,var(--success) 12%,var(--card));border-color:color-mix(in srgb,var(--success) 35%,var(--card));color:var(--success)}
.complete:has(input:checked) input{border-color:var(--success);background:var(--success)}
.complete:has(input:checked) .when-todo{display:none}.complete:has(input:checked) .when-done{display:inline}
.lesson-footer:has(.complete input:not(:checked)) .pager .next{background:var(--card);border-color:var(--border-strong);color:var(--foreground)}
.lesson-footer:has(.complete input:not(:checked)) .pager .next:hover{background:var(--secondary)}
.complete-group{display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.complete-caption{max-width:320px;font-size:13.5px;line-height:1.4;color:var(--muted)}
.complete-caption:empty{display:none}
.complete-caption.good{color:var(--success)}
.lesson-footer .save-state{flex-basis:100%;margin:0;font-size:14px;color:var(--destructive)}
.lesson>.auto-note{position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.pager{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-weight:600;font-size:15px;text-decoration:none;color:var(--foreground);background:var(--card);transition:background-color .2s,border-color .2s,color .2s,box-shadow .2s,transform .15s cubic-bezier(.3,.7,.4,1)}
.btn:hover{background:var(--secondary);color:var(--foreground)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.btn.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover);color:var(--primary-foreground)}

@media(min-width:1440px){.shell{grid-template-columns:330px minmax(0,1fr)}}
/* wide pieces spill past the text by up to 64px a side, only into space main actually has */
.lesson>figure,.lesson>.lab,.lesson>pre,.lesson>.code-tools,.lesson>.table-wrap,.lesson>.problem{margin-left:calc(-1*clamp(0px,(100cqi - 100%)/2,64px));margin-right:calc(-1*clamp(0px,(100cqi - 100%)/2,64px))}
@media(max-width:1100px){.brand-name small{display:none}.shell{grid-template-columns:272px minmax(0,1fr)}}
@media(max-width:860px){.shell{grid-template-columns:236px minmax(0,1fr)}.sidebar{padding:18px 10px 14px 16px}main{padding-top:32px}}
@media(max-width:650px){
 :root{--top-h:56px}
 body{font-size:17px}
 .top{gap:10px}.brand-mark{min-width:40px;height:34px;font-size:13px}.brand-name{font-size:16px}
 .shell{display:block}
 .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);padding:10px 16px 12px}
 .side-head{display:flex;align-items:center;min-height:38px;margin-bottom:8px}
 .contents-toggle{display:flex;align-items:center;gap:8px;max-width:calc(100% - 46px);min-height:38px;padding:0 4px;border:0;background:transparent;font:600 15px var(--font-sans);text-align:left}
 .contents-toggle span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .contents-toggle svg{flex:none;width:12px;height:12px;color:var(--muted);transition:transform .2s}
 .sidebar.expanded .contents-toggle svg{transform:rotate(180deg)}
 .sidebar-toggle{display:none}
 .side-foot{order:1;padding-top:0;border-top:0}
 .lesson-scroll{order:2;display:none;max-height:60vh;margin-top:10px}
 .sidebar.expanded .lesson-scroll{display:block}
 main{padding:26px 16px 64px}
 .lesson h1{font-size:29px}.lead{font-size:18px}
 .lab{padding:16px}.videos{padding:14px 16px 4px}
 .lane{grid-template-columns:1fr;gap:3px}
 pre{padding:14px}
 .lesson-footer{flex-direction:column;align-items:stretch}.pager{justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
@media print{.top,.sidebar,.lesson-footer,.code-tools,.controls,.quiz button{display:none!important}.shell{display:block}body,main{padding:0;background:#fff}.lesson,.js .lesson[hidden]{display:block!important;max-width:none;break-before:page}.lesson:first-child{break-before:auto}details.answer>*{display:block}.only-print{display:block}.lab,.quiz{break-inside:avoid;box-shadow:none}pre{white-space:pre-wrap;overflow:visible}pre code{white-space:pre-wrap}body{font-size:11pt;color:#000}a{color:inherit}h1,h2,h3{break-after:avoid}.videos{display:none!important}}

<header class="top"><button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Collapse sidebar" title="Collapse sidebar" aria-expanded="true"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6.25 3v10" stroke="currentColor" stroke-width="1.5"/></svg></button><a class="brand" href="#orientation"><span class="brand-mark" aria-hidden="true">TLA+</span><span class="brand-name">TLA+ Course<small>Lamport’s video lectures, then real systems</small></span></a><div class="top-actions"><button id="theme" class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch to dark mode"><svg viewBox="0 0 24 24" aria-hidden="true"><mask id="theme-moon"><rect width="24" height="24" fill="#fff"/><circle class="theme-cut" cx="17" cy="7" r="7" fill="#000"/></mask><circle class="theme-sun" cx="12" cy="12" r="9" fill="currentColor" mask="url(#theme-moon)"/><path class="theme-rays" d="M12 1.5v2M12 20.5v2M1.5 12h2M20.5 12h2M4.6 4.6L6 6M18 18l1.4 1.4M4.6 19.4L6 18M18 6l1.4-1.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div></header>

</main></div>

<script>
(()=>{
'use strict';
document.documentElement.classList.add('js');
const lessons=[...document.querySelectorAll('.lesson')];
const key='tla-course-v1';
let state={done:{},notes:{},answers:{},reading:{},current:'orientation',theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',updatedAt:0};
let storage=true;
let uninstalling=false;
let diskStatus=window.__courseSavePath?'saving':'browser';
let saveTimer;
let pendingDiskSnapshot=null;
let diskWritePromise=null;
let shownLesson=null;
let restoringScroll=false;
let readingTimer;
function restoreState(raw){
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return;
 for(const field of ['done','notes','answers','reading']){
  if(!raw[field]||typeof raw[field]!=='object'||Array.isArray(raw[field]))continue;
  const entries=Object.entries(raw[field]).filter(([id,value])=>field==='done'?typeof value==='boolean':field==='reading'?typeof value==='number'&&Number.isFinite(value)&&value>=0&&value<=1:typeof value==='string');
  state[field]=Object.fromEntries(entries);
 }
 if(lessons.some(l=>l.id===raw.current))state.current=raw.current;
 if(['light','dark'].includes(raw.theme))state.theme=raw.theme;
 if(typeof raw.updatedAt==='number'&&Number.isFinite(raw.updatedAt))state.updatedAt=raw.updatedAt;
}
let localSnapshot=null;
try{localSnapshot=JSON.parse(localStorage.getItem(key)||'null');}catch{storage=false;}
const appSnapshot=window.__courseProgress;
restoreState(appSnapshot&&(!localSnapshot||(appSnapshot.updatedAt||0)>=(localSnapshot.updatedAt||0))?appSnapshot:localSnapshot);
function showSaveStatus(){
 if(uninstalling)return;
 // only problems are shown: a failed save to the Mac, or no browser storage at all
 const message=diskStatus==='error'?'Saving to this Mac failed. Your next change tries again.':!storage&&!window.__courseSavePath?'This browser can’t store progress. Keep this tab open.':'';
 document.querySelectorAll('.save-state').forEach(el=>{el.textContent=message;el.hidden=!message;});
}
function flushProgress(){
 if(uninstalling)return Promise.resolve(false);
 clearTimeout(saveTimer);
 if(!window.__courseSavePath)return Promise.resolve(storage);
 pendingDiskSnapshot=JSON.stringify(state);
 if(diskWritePromise)return diskWritePromise;
 diskStatus='saving';showSaveStatus();
 diskWritePromise=(async()=>{
  try{
   while(pendingDiskSnapshot){
    const snapshot=pendingDiskSnapshot;pendingDiskSnapshot=null;
    const response=await fetch(window.__courseSavePath,{method:'POST',headers:{'Content-Type':'application/json'},body:snapshot});
    if(!response.ok)throw Error('Save failed');
    const result=await response.json();
    if(!result.saved)throw Error('Save was not acknowledged');
   }
   diskStatus='saved';return true;
  }catch{diskStatus='error';return false;}
  finally{diskWritePromise=null;showSaveStatus();}
 })();
 return diskWritePromise;
}
function save(){
 if(uninstalling)return;
 state.updatedAt=Math.max(Date.now(),state.updatedAt+1);
 const snapshot=JSON.stringify(state);
 try{localStorage.setItem(key,snapshot);storage=true;}catch{storage=false;}
 if(window.__courseSavePath){
  pendingDiskSnapshot=snapshot;diskStatus='saving';clearTimeout(saveTimer);saveTimer=setTimeout(flushProgress,250);
 }
 showSaveStatus();
}
function captureReading(){
 if(uninstalling)return;
 if(!shownLesson||restoringScroll)return;
 const extent=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
 state.reading[shownLesson]=extent?Math.max(0,Math.min(1,window.scrollY/extent)):0;
}
function saveBeforeLeaving(){
 if(uninstalling)return;
 captureReading();save();
 if(window.__courseSavePath){
  const snapshot=JSON.stringify(state);
  const blob=new Blob([snapshot],{type:'application/json'});
  if(blob.size<60000)navigator.sendBeacon(window.__courseSavePath,blob);
  else flushProgress();
 }
}
window.addEventListener('storage',event=>{
 if(event.key!==key||!event.newValue)return;
 try{
  const incoming=JSON.parse(event.newValue);
  if(!incoming||typeof incoming.updatedAt!=='number'||incoming.updatedAt<=state.updatedAt)return;
  const current=state.current;restoreState(incoming);state.current=current;
  lessons.forEach(lesson=>{
   const check=lesson.querySelector('.lesson-footer input[type="checkbox"]');
   if(check)check.checked=!!state.done[lesson.id];
   const mark=toc.querySelector('a[href="#'+lesson.id+'"] .done');if(mark)mark.hidden=!state.done[lesson.id];
  });
  updateProgress();
 }catch{}
});
window.addEventListener('course-uninstall',()=>{
 stopVideo();uninstalling=true;clearTimeout(saveTimer);clearTimeout(readingTimer);pendingDiskSnapshot=null;
 try{localStorage.removeItem(key);localStorage.removeItem(sidebarKey);}catch{}
 window.__courseSavePath=undefined;
 document.querySelector('.top').hidden=true;document.querySelector('.shell').hidden=true;
 const message=document.createElement('p');message.className='callout';message.setAttribute('role','status');message.textContent='TLA+ Course was uninstalled.';document.body.append(message);
});
window.addEventListener('pagehide',saveBeforeLeaving);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){captureReading();save();flushProgress();}});
window.addEventListener('scroll',()=>{if(!restoringScroll){captureReading();clearTimeout(readingTimer);readingTimer=setTimeout(save,400);}},{passive:true});
document.addEventListener('click',event=>{const link=event.target.closest('a[href^="#"]');if(link&&lessons.some(l=>'#'+l.id===link.hash)){captureReading();save();}});

// a checkbox dressed as a button: "Mark as completed" turns into a green "Completed", with a short celebration when ticked
function completeToggle(box,todoText,doneText,compact){
 const label=document.createElement('label');label.className='complete'+(compact?' compact':'');label.title='Click again to undo';
 const mark=document.createElement('span');mark.className='complete-mark';mark.append(box);mark.insertAdjacentHTML('beforeend','<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 10.4l2.7 2.7 5.3-5.6"/></svg>');
 const todo=document.createElement('span'),finished=document.createElement('span');todo.className='when-todo';todo.textContent=todoText;finished.className='when-done';finished.textContent=doneText;
 label.append(mark,todo,finished);
 label.addEventListener('animationend',event=>{if(event.target===label&&event.animationName==='complete-ring')label.classList.remove('celebrate');});
 box.addEventListener('change',()=>{label.classList.remove('celebrate');if(box.checked){void label.offsetWidth;label.classList.add('celebrate');}});
 return label;
}
const toc=document.getElementById('toc');let part='';
lessons.forEach((lesson,index)=>{
 // a heading per lecture or part, without its "Lecture N" prefix; the opening lesson needs none
 if(lesson.dataset.part!==part){part=lesson.dataset.part;if(index>0){const li=document.createElement('li');li.className='group';li.textContent=part.split(' · ').at(-1);toc.append(li);}}
 const li=document.createElement('li'),a=document.createElement('a');a.href='#'+lesson.id;
 const title=document.createElement('span');title.className='toc-title';title.textContent=lesson.dataset.title;
 const done=document.createElement('span');done.className='done';done.setAttribute('aria-label','Studied');done.textContent='✓';done.hidden=!state.done[lesson.id];
 a.append(title,done);li.append(a);toc.append(li);
 a.addEventListener('click',()=>setContents(false));
 const footer=document.createElement('div');footer.className='lesson-footer';const complete=document.createElement('input');complete.type='checkbox';complete.checked=!!state.done[lesson.id];const completeLabel=completeToggle(complete,'Mark as completed','Completed');complete.addEventListener('change',()=>{state.done[lesson.id]=complete.checked;done.hidden=!complete.checked;save();updateProgress();});
 const pager=document.createElement('div');pager.className='pager';if(index>0){const prev=document.createElement('a');prev.className='btn';prev.href='#'+lessons[index-1].id;prev.textContent='Previous';pager.append(prev);}if(index<lessons.length-1){const next=document.createElement('a');next.className='btn primary next';next.href='#'+lessons[index+1].id;next.textContent='Next: '+lessons[index+1].dataset.title;pager.append(next);}const saveError=document.createElement('p');saveError.className='save-state';saveError.setAttribute('role','status');saveError.hidden=true;const completeGroup=document.createElement('div');completeGroup.className='complete-group';completeGroup.append(completeLabel);footer.append(completeGroup,pager,saveError);lesson.append(footer);
});
showSaveStatus();
const lessonScroll=document.getElementById('lesson-scroll');
const sidebar=document.getElementById('sidebar');
const contentsToggle=document.getElementById('contents-toggle');
const narrow=matchMedia('(max-width:650px)');
// phone only: the lesson list folds under a button that names the current lesson
function setContents(open){open=open&&narrow.matches;if(open&&!sidebar.classList.contains('expanded'))replay(lessonScroll,'arrive');sidebar.classList.toggle('expanded',open);contentsToggle.setAttribute('aria-expanded',open);if(open)requestAnimationFrame(revealCurrentLesson);}
contentsToggle.addEventListener('click',()=>setContents(!sidebar.classList.contains('expanded')));
narrow.addEventListener('change',()=>setContents(false));
function revealCurrentLesson(){
 const current=toc.querySelector('[aria-current="page"]');
 if(!current||current.closest('li').hidden||!lessonScroll.clientHeight)return;
 const bounds=lessonScroll.getBoundingClientRect(),rect=current.getBoundingClientRect();
 if(rect.top<bounds.top+8)lessonScroll.scrollTop-=bounds.top+8-rect.top;
 else if(rect.bottom>bounds.bottom-8)lessonScroll.scrollTop+=rect.bottom-bounds.bottom+8;
}
window.addEventListener('resize',revealCurrentLesson);
const shell=document.querySelector('.shell'),sidebarToggle=document.getElementById('sidebar-toggle'),sidebarKey='tla-course-sidebar';
// wider screens: the sidebar folds to a rail; remembered in this browser only
function setSidebar(collapsed){shell.classList.toggle('collapsed',collapsed);sidebarToggle.setAttribute('aria-expanded',!collapsed);const label=collapsed?'Expand sidebar':'Collapse sidebar';sidebarToggle.setAttribute('aria-label',label);sidebarToggle.title=label;}
try{setSidebar(localStorage.getItem(sidebarKey)==='collapsed');}catch{}
requestAnimationFrame(()=>shell.classList.add('animate'));
sidebarToggle.addEventListener('click',()=>{const collapsed=!shell.classList.contains('collapsed');setSidebar(collapsed);try{localStorage.setItem(sidebarKey,collapsed?'collapsed':'open');}catch{}if(!collapsed){replay(lessonScroll,'arrive');setTimeout(revealCurrentLesson,260);}});
function updateProgress(){const count=lessons.filter(l=>state.done[l.id]).length;document.getElementById('progress-text').textContent=count+' / '+lessons.length+' studied';updateTrace();const bar=document.getElementById('course-progress');bar.max=lessons.length;bar.value=count;}
const videoPages='https://lamport.azurewebsites.net/video/';
const lecture=(number,yt,title,length,about,page,script,fix)=>({label:'Lecture '+number,by:'Leslie Lamport',yt,title,length,about,page:videoPages+page+'.html',script:videoPages+script+'-script.pdf',fix:fix&&videoPages+'corrections.html#'+fix});
const videos={
 talk:{label:'Talk',by:'Microsoft Research',yt:'-4Yp3j_jk8Q',title:'Leslie Lamport: Thinking Above the Code',about:'Why to think about what a program should do, and write it down, before writing code.'},
 l1:lecture(1,'p54W-XOIEF8','Introduction to TLA+','20:19','What TLA+ is, why you might use it, and the concept of a state machine.','intro','video1','lecture1'),
 l2:lecture(2,'4snwZl726c4','State Machines in TLA+','15:41','How a simple state machine is described in TLA+: your first glimpse of a specification.','smintla','video2'),
 l3:lecture(3,'4NtHUfXlf4g','Resources and Tools','11:14','Learning resources, then using the Toolbox to open a spec, pretty-print it, and run TLC.','video3','video3','lecture3'),
 l4:lecture(4,'IW0oA3Pxe-Q','Die Hard','19:40','Start writing TLA+ specs and checking them with the parser and TLC.','video4','video4','lecture4'),
 l5:lecture(5,'JwO4yPSEp-0','Transaction Commit','24:40','Commitment specified, and how to use mathematical functions in specifications.','video5','video5','lecture5'),
 l6:lecture(6,'U4mlGqXjtoA','Two-Phase Commit','21:23','How commitment is achieved, plus records in TLA+ and more about TLC.','video6','video6','lecture6'),
 l7:lecture(7,'u7fTLyiSnZw','Paxos Commit','19:47','A real fault-tolerant commit algorithm, and operations for constructing and combining sets.','video7','video7','lecture7'),
 l8a:lecture('8, part 1','1cp-Bv2ILT4','Implementation: Preliminaries','15:54','Introduces temporal formulas, ahead of what it means for one spec to implement another.','video8a','video8a','lecture8-1'),
 l8b:lecture('8, part 2','zGmR2qdyxss','Implementation: How it Works','12:14','What it means for one specification to implement another.','video8b','video8b'),
 l9a:lecture('9, part 1','G2QkMpiVFDo','The Alternating Bit Protocol: The High Level Specification','20:52','Liveness, which describes what must happen, and fairness.','video9a','video9a'),
 l9b:lecture('9, part 2','ata84UpVJkU','The Alternating Bit Protocol: The Protocol','18:46','The protocol itself, continuing liveness and fairness.','video9b','video9b','lecture9-2'),
 l10a:lecture('10, part 1','QS_A7Nu02lA','Implementation with Refinement: Preliminaries','19:53','The general meaning of implementation.','video10a','video10a','lecture10-1'),
 l10b:lecture('10, part 2','iS9voO5CGBg','Implementation with Refinement: Refinement Mappings','21:27','Refinement mappings, which the general meaning of implementation depends on.','video10b','video10b'),
 all:{label:'Full playlist',by:'Leslie Lamport',list:'PLWAv2Etpa7AOAwkreYImYt0gIpOdWQevD',title:'The TLA+ Video Course',length:'13 videos',about:'Every lecture in order. YouTube labels lecture 8 “Paxos Commit”; Lamport’s title is “Implementation”.',page:videoPages+'videos.html'}
};
const lessonVideos={orientation:['talk','l1'],states:['l2'],sets:['l5','l6'],counter:['l4'],tools:['l3'],fairness:['l9a','l9b'],messages:['l9b'],transactions:['l5','l6','l7'],consensus:['l7'],refinement:['l8a','l8b','l10a','l10b'],review:['all']};
// players sit in the page with no src; showLesson loads the shown lesson's and stopVideo blanks them all
function stopVideo(){document.querySelectorAll('.video-frame iframe[src]').forEach(f=>{if(f.getAttribute('src')!=='about:blank')f.src='about:blank';});}
function videoLink(text,href){const a=document.createElement('a');a.target='_blank';a.rel='noopener noreferrer';a.href=href;a.textContent=text;return a;}
function videoCard(video){
 const card=document.createElement('div');card.className='video';
 const frame=document.createElement('div');frame.className='video-frame';
 const watch=video.list?'https://www.youtube.com/playlist?list='+video.list:'https://www.youtube.com/watch?v='+video.yt;
 if(location.protocol==='file:'){
  // YouTube refuses to embed in a page opened as a file (error 153), so show the thumbnail and link out
  const poster=document.createElement('a');poster.className='video-poster';poster.href=watch;poster.target='_blank';poster.rel='noopener noreferrer';
  if(video.yt){const img=document.createElement('img');img.alt='';img.loading='lazy';img.src='https://i.ytimg.com/vi/'+video.yt+'/hqdefault.jpg';img.addEventListener('error',()=>img.remove());poster.append(img);}
  const label=document.createElement('span');label.textContent='Watch on YouTube';poster.append(label);frame.append(poster);
 }else{
  const iframe=document.createElement('iframe');iframe.title=video.title;iframe.allow='encrypted-media; picture-in-picture; fullscreen';iframe.allowFullscreen=true;iframe.referrerPolicy='strict-origin-when-cross-origin';
  iframe.dataset.src='https://www.youtube-nocookie.com/embed/'+(video.list?'videoseries?list='+video.list+'&':video.yt+'?')+'rel=0';
  frame.append(iframe);
 }
 const head=document.createElement('div');head.className='video-head';
 const text=document.createElement('span'),name=document.createElement('span'),meta=document.createElement('span');
 name.className='video-name';name.textContent=video.title;
 meta.className='video-meta';meta.textContent=video.label+(video.by?' by '+video.by:'');text.className='video-text';
 const length=document.createElement('span');length.className='video-length';length.textContent=video.length||'';
 text.append(name,meta);head.append(text,length);
 const about=document.createElement('p');about.className='video-about';about.textContent=video.about;
 const links=document.createElement('div');links.className='video-links';
 links.append(videoLink('Open on YouTube',watch));
 if(video.page)links.append(videoLink(video.list?'Lamport’s course page':'Lamport’s page',video.page));
 if(video.script)links.append(videoLink('Script (PDF)',video.script));
 if(video.fix)links.append(videoLink('Corrections',video.fix));
 card.append(frame,head,about,links);return card;
}
Object.entries(lessonVideos).forEach(([id,keys])=>{
 const lesson=document.getElementById(id);
 const block=document.createElement('section');block.className='videos';block.setAttribute('aria-labelledby','videos-'+id);
 const heading=document.createElement('h2');heading.id='videos-'+id;heading.textContent=keys.length>1?'Videos for this topic':'Video for this topic';
 const note=document.createElement('p');note.className='videos-note';note.textContent='The player needs internet. The lesson works without it.';
 block.append(heading,note,...keys.map(k=>videoCard(videos[k])));
 lesson.querySelector('h1').nextElementSibling.after(block);
});
const trace=document.getElementById('trace');
// one group per part, so a lecture's cells wrap together
let tracePart=null;
lessons.forEach((lesson,index)=>{
 if(index===0||lesson.dataset.part!==lessons[index-1].dataset.part){tracePart=document.createElement('span');tracePart.className='trace-part';trace.append(tracePart);}
 const cell=document.createElement('span');cell.title=lesson.dataset.title;cell.dataset.id=lesson.id;
 if(lesson.querySelector('.problem'))cell.classList.add('ps');
 cell.addEventListener('click',()=>{location.hash=lesson.id;});tracePart.append(cell);tracePart.style.flexGrow=tracePart.children.length;
});
function updateTrace(){trace.querySelectorAll('[data-id]').forEach(cell=>{cell.classList.toggle('done',!!state.done[cell.dataset.id]);cell.classList.toggle('current',cell.dataset.id===shownLesson);});}
function showLesson(id,focus=false){
 stopVideo();
 const lesson=lessons.find(l=>l.id===id)||lessons[0];
 restoringScroll=true;shownLesson=lesson.id;
 lessons.forEach(l=>l.hidden=l!==lesson);
 document.getElementById('contents-current').textContent=lesson.dataset.title;
 lesson.querySelectorAll('.video-frame iframe').forEach(f=>{if(f.getAttribute('src')!==f.dataset.src)f.src=f.dataset.src;});
 toc.querySelectorAll('a').forEach(a=>{if(a.hash==='#'+lesson.id)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});updateTrace();
 state.current=lesson.id;save();document.title=lesson.dataset.title+' · TLA+ course';
 requestAnimationFrame(()=>{
  const extent=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
  window.scrollTo({top:(state.reading[lesson.id]||0)*extent,behavior:'instant'});
  revealCurrentLesson();
  if(focus)document.getElementById('content').focus({preventScroll:true});
  requestAnimationFrame(()=>{restoringScroll=false;});
 });
}
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(lessons.some(l=>l.id===id))showLesson(id,true);});
showLesson(lessons.some(l=>l.id===location.hash.slice(1))?location.hash.slice(1):state.current);
function setTheme(){document.documentElement.dataset.theme=state.theme;const button=document.getElementById('theme'),label=state.theme==='dark'?'Switch to light mode':'Switch to dark mode';button.setAttribute('aria-label',label);button.title=label;}setTheme();requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById('theme').classList.add('ready')));// the new theme spreads out in a circle from the button, where the browser supports view transitions
document.getElementById('theme').addEventListener('click',event=>{
 state.theme=state.theme==='light'?'dark':'light';save();
 if(!document.startViewTransition||matchMedia('(prefers-reduced-motion: reduce)').matches){setTheme();return;}
 const r=event.currentTarget.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2,radius=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
 document.startViewTransition(setTheme).ready.then(()=>document.documentElement.animate({clipPath:['circle(0 at '+x+'px '+y+'px)','circle('+radius+'px at '+x+'px '+y+'px)']},{duration:550,easing:'cubic-bezier(.4,0,.2,1)',pseudoElement:'::view-transition-new(root)'})).catch(()=>{});
});
// replay a short arrival each time a quiz, number check or lab status says something new
function replay(el,name='pop'){if(!el)return;el.classList.remove(name);void el.offsetWidth;el.classList.add(name);}
document.addEventListener('click',event=>{const box=event.target.closest('.quiz,.numcheck');if(box&&event.target.closest('button'))replay(box.querySelector('.quiz-feedback'));});
const statusWatch=new MutationObserver(records=>records.forEach(r=>replay(r.target.nodeType===1?r.target.closest('.status'):r.target.parentElement&&r.target.parentElement.closest('.status'))));
document.querySelectorAll('.lab .status').forEach(el=>statusWatch.observe(el,{childList:true,characterData:true,subtree:true}));
let openBefore=[];window.addEventListener('beforeprint',()=>{openBefore=[...document.querySelectorAll('details.answer,details.hint')].map(d=>[d,d.open]);openBefore.forEach(([d])=>d.open=true);});window.addEventListener('afterprint',()=>{openBefore.forEach(([d,open])=>d.open=open);});
document.querySelectorAll('.quiz').forEach((quiz,index)=>{const button=quiz.querySelector('button'),feedback=quiz.querySelector('.quiz-feedback'),id=quiz.closest('.lesson').id+'-'+index;const saved=state.answers[id];if(typeof saved==='string'){const input=[...quiz.querySelectorAll('input')].find(i=>i.value===saved);if(input)input.checked=true;}
button.addEventListener('click',()=>{const selected=quiz.querySelector('input:checked');if(!selected){feedback.textContent='Choose an answer first.';feedback.className='quiz-feedback';return;}const correct=selected.value===quiz.dataset.answer;feedback.textContent=(correct?'Correct. ':'Try again. ')+quiz.dataset.explain;feedback.className='quiz-feedback '+(correct?'good':'bad');state.answers[id]=selected.value;save();});});
document.querySelectorAll('pre').forEach(pre=>{const row=document.createElement('div');row.className='code-tools';const button=document.createElement('button');button.type='button';button.textContent='Copy code';button.addEventListener('click',async()=>{const text=pre.textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-9999px';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('Copy unavailable');}button.textContent='Copied';}catch{button.textContent='Select and copy the code';}setTimeout(()=>button.textContent='Copy code',2200);});row.append(button);pre.after(row);});
updateProgress();
})();
</script>
<script>
(() => {
  'use strict';
  const byId = id => document.getElementById(id);
  const listen = (id, event, fn) => byId(id)?.addEventListener(event, fn);
  const text = (id, value) => { const el = byId(id); if (el) el.textContent = value; };
  const clamp = (value, low, high, fallback) => {
    const n = Number(value);
    return Number.isFinite(n) && String(value).trim() !== '' ? Math.max(low, Math.min(high, Math.round(n))) : fallback;
  };
  const node = (tag, cls, content) => {
    const el = document.createElement(tag);
    if (cls) el.className = cls;
    if (content !== undefined) el.textContent = content;
    return el;
  };

  function initCounter() {
    const graph = byId('counter-graph');
    if (!graph) return;
    let current = 0;
    const max = () => clamp(byId('counter-max').value, 1, 6, 3);
    const buggy = () => byId('counter-bug').checked;
    const successor = x => (buggy() ? x <= max() : x < max()) ? x + 1 : null;
    function reachable() {
      const queue = [0], seen = new Set(queue), predecessor = new Map();
      while (queue.length) {
        const state = queue.shift();
        const next = successor(state);
        if (next !== null && !seen.has(next)) {
          seen.add(next);
          predecessor.set(next, state);
          queue.push(next);
        }
      }
      return { states: [...seen], predecessor };
    }
    function svg(tag, attrs, content) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      for (const [key, val] of Object.entries(attrs)) el.setAttribute(key, val);
      if (content !== undefined) el.textContent = content;
      return el;
    }
    function draw() {
      const {states} = reachable();
      const width = Math.max(240, Math.round(graph.clientWidth || 620));
      const columns = Math.max(2, Math.min(states.length, Math.floor((width - 20) / 86)));
      const rows = Math.ceil(states.length / columns);
      const height = rows * 86 + 14;
      graph.setAttribute('viewBox', `0 0 ${width} ${height}`);
      graph.replaceChildren();
      graph.append(svg('title', {}, `Counter graph: states ${states.join(', ')}. Current value ${current}. Bound ${max()}.`));
      const defs = svg('defs', {}), marker = svg('marker', {id:'counter-arrowhead', viewBox:'0 0 10 10', refX:8, refY:5, markerWidth:5, markerHeight:5, orient:'auto-start-reverse'});
      marker.append(svg('path', {d:'M 0 0 L 10 5 L 0 10 z', fill:'var(--muted)'}));
      defs.append(marker); graph.append(defs);
      const gap = (width - 70) / Math.max(1, columns - 1);
      const positions = states.map((_, i) => {
        const row = Math.floor(i / columns), col = i % columns;
        return {x:35 + (row % 2 ? columns - 1 - col : col) * gap, y:36 + row * 86};
      });
      positions.forEach((p, i) => {
        if (i === 0) return;
        const prev = positions[i - 1], dx=p.x-prev.x, dy=p.y-prev.y, len=Math.hypot(dx,dy);
        graph.append(svg('line', {x1:prev.x+dx/len*26,y1:prev.y+dy/len*26,x2:p.x-dx/len*29,y2:p.y-dy/len*29,class:'edge','marker-end':'url(#counter-arrowhead)'}));
      });
      positions.forEach((p, i) => {
        const value = states[i];
        const classes = ['vertex'];
        if (value === current) classes.push('current');
        if (value > max()) classes.push('failure');
        graph.append(svg('circle', {cx:p.x,cy:p.y,r:25,class:classes.join(' ')}));
        graph.append(svg('text', {x:p.x,y:p.y+5,'text-anchor':'middle'}, `x=${value}`));
        if (value > max()) graph.append(svg('text', {x:p.x,y:p.y+46,'text-anchor':'middle'}, 'unsafe'));
      });
      byId('counter-step').disabled = successor(current) === null;
    }
    function status(message, bad=false) {
      const el=byId('counter-status'); el.textContent=message;
      el.classList.toggle('bad',bad); el.classList.toggle('good',!bad);
    }
    function restart() {
      byId('counter-max').value=max(); current=0; draw();
      status(`Initial state x = 0. Invariant x ≤ ${max()} holds.`);
    }
    listen('counter-step','click',()=>{
      const next=successor(current); if(next===null)return;
      current=next; draw();
      status(`Current state x = ${current}. ${current>max()?'Invariant violated':'Invariant holds'}: x ≤ ${max()}.`,current>max());
    });
    listen('counter-explore','click',()=>{
      const {states,predecessor}=reachable();
      const badState=states.find(x=>x>max());
      if(badState!==undefined){
        const trace=[];let state=badState;
        for(;;){trace.unshift(state);if(!predecessor.has(state))break;state=predecessor.get(state);}
        current=badState; draw(); status(`JavaScript BFS completed: ${states.length} reachable states. Shortest violation: ${trace.join(' → ')}.`,true);
      }else{
        draw();status(`JavaScript BFS completed: ${states.length} reachable states. No state violates x ≤ ${max()} in this model.`);
      }
    });
    listen('counter-reset','click',restart);listen('counter-max','change',restart);listen('counter-bug','change',restart);
    if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>draw()).observe(graph);
    restart();
  }

  function initTicket() {
    if(!byId('ticket-lab'))return;
    let index=0;
    const paths={
      split:[
        ['Not checked','Not checked',1,0,'Initial state.'],
        ['Saw one ticket','Not checked',1,0,'A checks availability.'],
        ['Saw one ticket','Saw one ticket',1,0,'B checks before A reserves. Both checks pass.'],
        ['Reserved','Saw one ticket',0,1,'A reserves. B still relies on its earlier observation.'],
        ['Reserved','Reserved',-1,2,'B reserves from a stale check. One ticket has been sold twice.']
      ],
      atomic:[
        ['Not attempted','Not attempted',1,0,'Initial state.'],
        ['Reserved','Not attempted',0,1,'A checks and reserves in one atomic action.'],
        ['Reserved','Cannot reserve',0,1,'B cannot take Reserve: its availability guard is false. The modeled state stays unchanged.']
      ]
    };
    function draw(){
      const path=paths[byId('ticket-mode').value],s=path[index];
      text('ticket-a',s[0]);text('ticket-b',s[1]);text('ticket-stock',`${s[2]} left · ${s[3]} reservations`);
      text('ticket-log',`Step ${index} of ${path.length-1}\n${s[4]}\n${s[3]>1?'VIOLATION: reservations > 1.':'Invariant holds: reservations ≤ 1.'}`);
      byId('ticket-log').classList.toggle('bad',s[3]>1);byId('ticket-next').disabled=index===path.length-1;
    }
    function reset(){index=0;draw();}
    listen('ticket-next','click',()=>{if(index<paths[byId('ticket-mode').value].length-1)index++;draw();});
    listen('ticket-reset','click',reset);listen('ticket-mode','change',reset);draw();
  }

  function initRetry(){
    if(!byId('retry-lab'))return;
    let index=0;
    const paths={
      unsafe:[
        [0,false,'Worker receives request r.'],
        [1,false,'The charge is durable, but the request ID has not been recorded.'],
        [1,false,'Worker crashes. Volatile progress is lost; the durable charge remains.'],
        [2,false,'After recovery, the retry sees no durable ID and charges again.'],
        [2,true,'The ID is finally recorded. The duplicate durable effect cannot be undone by deduplication.']
      ],
      safe:[
        [0,false,'Worker receives request r.'],
        [1,true,'One atomic durable commit records both the charge and request ID.'],
        [1,true,'Worker crashes before replying. Both durable records survive.'],
        [1,true,'After recovery, the retry finds r and returns the prior result without another charge.']
      ]
    };
    function draw(){
      const path=paths[byId('retry-mode').value],s=path[index];
      text('retry-store',`effects = ${s[0]}; seen(r) = ${s[1]}`);
      text('retry-log',`Step ${index} of ${path.length-1}\n${s[2]}\n${s[0]>1?'VIOLATION: effects(r) > 1.':'No duplicate effect so far: effects(r) ≤ 1.'}`);
      byId('retry-log').classList.toggle('bad',s[0]>1);byId('retry-next').disabled=index===path.length-1;
    }
    function reset(){index=0;draw();}
    listen('retry-next','click',()=>{if(index<paths[byId('retry-mode').value].length-1)index++;draw();});
    listen('retry-reset','click',reset);listen('retry-mode','change',reset);draw();
  }

  function initFairness(){
    if(!byId('fair-lab'))return;
    const schedules={
      always:{enabled:['yes','yes','yes','yes','yes','yes','…'],runs:['no','no','no','no','no','no','…'],result:'Repeating behavior: Serve stays enabled forever but never executes.\nWeak fairness: violated.\nStrong fairness: violated.\nEventual service: false.'},
      flicker:{enabled:['yes','no','yes','no','yes','no','…'],runs:['no','no','no','no','no','no','…'],result:'Repeating behavior: another action toggles eligibility forever; Serve never executes.\nWeak fairness: satisfied, because Serve is never continuously enabled forever.\nStrong fairness: violated, because Serve is enabled infinitely often.\nEventual service: false.'},
      served:{enabled:['yes','yes','yes','no','no','no','…'],runs:['no','no','yes','no','no','no','…'],result:'Serve executes once and permanently completes this request; it is disabled thereafter.\nWeak fairness: satisfied.\nStrong fairness: satisfied.\nEventual service: true. Fairness imposes no fixed deadline.'}
    };
    function draw(){
      const s=schedules[byId('fair-pattern').value],timeline=byId('fair-timeline');timeline.replaceChildren();
      for(const [label,values] of [['Enabled',s.enabled],['Executes',s.runs]]){
        timeline.append(node('span','',label));const track=node('div','track');
        values.forEach(v=>track.append(node('span','chip',v)));timeline.append(track);
      }
      text('fair-result',s.result);
    }
    listen('fair-pattern','change',draw);draw();
  }

  function initCommit(){
    if(!byId('commit-lab'))return;
    let preparedA=false,preparedB=false,alive=true,decision='undecided';
    let event='Both participants are working.';
    function draw(){
      const participant=value=>decision==='commit'?'committed':value?'prepared':'working';
      text('commit-state',`Coordinator: ${alive?'alive':'crashed'}\nParticipant A: ${participant(preparedA)}\nParticipant B: ${participant(preparedB)}\nDecision: ${decision}\n\n${event}${!alive&&decision==='undecided'?'\nNo Commit transition is enabled. This lab omits recovery; restart to explore another execution.':''}`);
      byId('prepare-a').disabled=preparedA||decision!=='undecided';byId('prepare-b').disabled=preparedB||decision!=='undecided';
      byId('commit-crash').disabled=!alive||decision!=='undecided';
      byId('commit-decide').disabled=!alive||!preparedA||!preparedB||decision!=='undecided';
    }
    listen('prepare-a','click',()=>{preparedA=true;event='A durably prepares.';draw();});
    listen('prepare-b','click',()=>{preparedB=true;event='B durably prepares.';draw();});
    listen('commit-crash','click',()=>{alive=false;event='The coordinator can no longer decide.';draw();});
    listen('commit-decide','click',()=>{if(alive&&preparedA&&preparedB&&decision==='undecided'){decision='commit';event='The abstract coordinator commits. Message delivery and recovery are omitted in this lab.';}draw();});
    listen('commit-reset','click',()=>{preparedA=false;preparedB=false;alive=true;decision='undecided';event='Both participants are working.';draw();});draw();
  }

  function initQuorum(){
    if(!byId('quorum-n'))return;
    function draw(){
      const n=clamp(byId('quorum-n').value,3,7,3);
      const r=clamp(byId('quorum-r').value,1,n,Math.min(2,n)),w=clamp(byId('quorum-w').value,1,n,Math.min(2,n));
      byId('quorum-r').max=n;byId('quorum-w').max=n;byId('quorum-r').value=r;byId('quorum-w').value=w;
      const write=Array.from({length:w},(_,i)=>i+1),read=Array.from({length:r},(_,i)=>n-r+i+1),overlap=write.filter(i=>read.includes(i));
      const graph=byId('quorum-graph');graph.replaceChildren();graph.classList.add('flow');
      for(let i=1;i<=n;i++){
        const el=node('div','node',`n${i}`);el.append(node('small','',write.includes(i)&&read.includes(i)?'read + write':write.includes(i)?'write':read.includes(i)?'read':'neither'));graph.append(el);
      }
      const labels=set=>`{${set.map(i=>'n'+i).join(', ')}}`;
      text('quorum-result',`N = ${n}, R = ${r}, W = ${w}\nWrite set: ${labels(write)}\nRead set: ${labels(read)}\nIntersection: ${labels(overlap)}\n\n${r+w>n?'Every size-R read set intersects every size-W write set. The sets above show the minimum possible overlap.':'Disjoint read and write sets are possible; the sets above are a counterexample to guaranteed intersection.'}\nIntersection alone does not prove freshness or linearizability: version selection, concurrent writes, and the protocol still matter.`);
    }
    for(const id of ['quorum-n','quorum-r','quorum-w'])listen(id,'change',draw);draw();
  }

  function initFlashcards(){
    if(!byId('flash-question'))return;
    const cards=[
      ['What is a state?','An assignment of values to all modeled variables. A snapshot, not a transition.'],
      ['What does an action describe?','A relation between the current and next states. Its conjuncts constrain one simultaneous step.'],
      ["What does x′ mean?",'The value of x in the next state. Equality with a primed expression is a constraint, not an imperative assignment.'],
      ['Definition or equality: == versus =?','== defines an operator; = compares values.'],
      ['Set or sequence for a FIFO?','A sequence preserves order and repeated values. A set does neither.'],
      ['What does [S -> T] denote?','The set of all functions from domain S to codomain T. A maplet expression constructs one function.'],
      ['What is the usual behavior skeleton?','Init /\\ [][Next]_vars. Every step obeys Next or leaves the variable tuple unchanged.'],
      ['What happens if a next-state variable is omitted?','It is not implicitly preserved. Mathematically it may be unconstrained; TLC may report an incomplete successor. Use an explicit next-value constraint or UNCHANGED.'],
      ['Why does the wrong counter guard fail?','x ≤ Max still enables incrementing at Max, producing Max + 1.'],
      ['What does a completed TLC run establish?','The selected properties for the explored finite model, under its exact assumptions and constraints—not all sizes or the deployed implementation.'],
      ['What do PlusCal labels determine?','Atomic-step boundaries in the translation. Moving a label changes possible interleavings.'],
      ['Safety or liveness: every request eventually completes?','Liveness. It rules out infinite behaviors that postpone completion forever.'],
      ['What is a counterexample to an invariant?','A finite execution prefix reaching a state where the invariant is false.'],
      ['What are the inductive proof obligations?','Init implies Inv; Inv and each transition imply Inv in the next state; Inv implies the desired safety property.'],
      ['Weak fairness versus strong fairness?','Weak fairness forbids perpetual postponement when continuously enabled. Strong fairness also covers an action enabled infinitely often. Neither gives a time bound.'],
      ['Does fairness of A or B ensure B progresses?','No. A can satisfy aggregate fairness while B starves. Analyze enabling and fairness for the individual action.'],
      ['Does a timeout prove a request had no effect?','No. The server may have applied the effect and lost the reply. Track the client’s knowledge separately from the durable result.'],
      ['Why atomically persist effect and deduplication ID?','Effect first can duplicate after a crash; ID first can suppress an effect that never happened. The atomic contract must cover both.'],
      ['Why can two-phase commit block?','Prepared participants may not know the durable global decision while the coordinator is unavailable. Unilateral timeout decisions can violate agreement.'],
      ['What does R + W > N guarantee?','Intersection of every read set of size R with every write set of size W in that same universe. It alone is not a linearizability proof.'],
      ['Why is a fencing token useful?','The protected resource can reject stale owners after a newer epoch has been installed. A lease timeout alone does not stop a paused owner from resuming.'],
      ['Why are majorities insufficient during arbitrary reconfiguration?','A majority of an old configuration may be disjoint from a majority of a new one. The transition protocol must preserve the necessary decision evidence.'],
      ['What is a refinement mapping?','A mapping from concrete state to abstract state. Concrete steps must correspond to permitted abstract steps or stuttering, with suitable initialization and progress obligations.'],
      ['Invariant or state constraint?','An invariant is checked and fails on a violating reachable state. A state constraint limits exploration, possibly removing behaviors needed to expose a bug.'],
      ['History variable versus prophecy variable?','A history variable records past behavior. A prophecy variable can encode a future choice for refinement reasoning. Auxiliary state must not improperly restrict the visible behaviors.'],
      ['How should a crash action treat durable state?','Erase the intended volatile state, preserve the durable state promised by the storage model, and explicitly frame every other variable.'],
      ['What makes a capstone model useful?','A precise contract, explicit failure assumptions, justified bounds, meaningful properties, deliberate bug mutations, and recorded evidence from completed checks.']
    ];
    let queue=cards.map((_,i)=>i),known=0,revealed=false;
    function draw(){
      const complete=queue.length===0;
      text('flash-count',`${known} / ${cards.length} recalled · ${queue.length} remaining`);
      text('flash-question',complete?'Review complete':cards[queue[0]][0]);
      text('flash-answer',complete?'Revisit the difficult cards in a later study session.':cards[queue[0]][1]);
      byId('flash-answer').hidden=!complete&&!revealed;
      text('flash-reveal',complete?'Restart review':'Reveal answer');byId('flash-reveal').disabled=!complete&&revealed;
      byId('flash-again').disabled=complete||!revealed;byId('flash-known').disabled=complete||!revealed;
    }
    listen('flash-reveal','click',()=>{
      if(!queue.length){queue=cards.map((_,i)=>i);known=0;revealed=false;}else revealed=true;
      draw();
    });
    listen('flash-again','click',()=>{
      if(!revealed||!queue.length)return;
      const card=queue.shift();queue.splice(Math.min(3,queue.length),0,card);revealed=false;draw();
    });
    listen('flash-known','click',()=>{
      if(!revealed||!queue.length)return;
      queue.shift();known++;revealed=false;draw();
    });draw();
  }

  initCounter();initTicket();initRetry();initFairness();initCommit();initQuorum();initFlashcards();
})();

</script>
<script>
(()=>{
const el=id=>document.getElementById(id);
let latest=0, pending=new Set(), view={tag:'idle'}, events=[];
const query=id=>id===1?'cats':'dogs';
function drawApp(){
 el('appstate-choice').textContent=latest?query(latest)+' (request '+latest+')':'No search';
 el('appstate-screen').textContent=view.tag==='ready'?view.value+' (response '+view.request+')':view.tag;
 const bad=view.tag==='ready'&&view.request!==latest;
 el('appstate-log').textContent='latest = '+latest+'; pending = {'+[...pending].join(', ')+'}; ui = '+JSON.stringify(view)+'\n'+events.join('\n')+'\n'+(bad?'VIOLATION: an older response replaced the current view.':'CurrentView holds.');
 el('appstate-log').classList.toggle('bad',bad);
 el('appstate-start-a').disabled=latest!==0;el('appstate-start-b').disabled=latest!==1;
 el('appstate-finish-a').disabled=!pending.has(1);el('appstate-finish-b').disabled=!pending.has(2);
}
function start(id){latest=id;pending.add(id);view={tag:'loading',request:id};events.push('Start('+id+'): user searches '+query(id)+'.');drawApp();}
function finish(id){pending.delete(id);if(!el('appstate-guard').checked||id===latest){view={tag:'ready',request:id,value:query(id)};events.push('Deliver('+id+'): display '+query(id)+'.');}else events.push('Deliver('+id+'): discard the obsolete response.');drawApp();}
function resetApp(){latest=0;pending=new Set();view={tag:'idle'};events=[];drawApp();}
el('appstate-start-a').addEventListener('click',()=>start(1));el('appstate-start-b').addEventListener('click',()=>start(2));el('appstate-finish-a').addEventListener('click',()=>finish(1));el('appstate-finish-b').addEventListener('click',()=>finish(2));el('appstate-reset').addEventListener('click',resetApp);el('appstate-guard').addEventListener('change',resetApp);drawApp();
let source=0,cached=0,valid=false,loading=false,captured=0,cacheEvents=[];
function drawCache(){
 el('cache-source').textContent='version '+source;el('cache-flight').textContent=loading?'captured version '+captured:'None';el('cache-value').textContent=valid?'valid version '+cached:'invalid';
 const bad=valid&&cached!==source;
 el('cache-log').textContent='sourceVersion = '+source+'; cacheVersion = '+cached+'; valid = '+valid+'\n'+cacheEvents.join('\n')+'\n'+(bad?'VIOLATION: the valid cache contains an obsolete value.':'FreshWhenValid holds.');el('cache-log').classList.toggle('bad',bad);
 el('cache-begin').disabled=loading||valid;el('cache-write').disabled=source>=2;el('cache-finish').disabled=!loading;
}
el('cache-begin').addEventListener('click',()=>{loading=true;captured=source;cacheEvents.push('BeginFill: capture v'+captured+'.');drawCache();});
el('cache-write').addEventListener('click',()=>{source++;valid=false;cacheEvents.push('WriteAndInvalidate: source is now v'+source+'; invalidate cache.');drawCache();});
el('cache-finish').addEventListener('click',()=>{loading=false;if(!el('cache-guard').checked||captured===source){cached=captured;valid=true;cacheEvents.push('FinishFill: publish v'+cached+'.');}else cacheEvents.push('FinishFill: reject obsolete v'+captured+'.');drawCache();});
function resetCache(){source=0;cached=0;valid=false;loading=false;captured=0;cacheEvents=[];drawCache();}
el('cache-reset').addEventListener('click',resetCache);el('cache-guard').addEventListener('change',resetCache);drawCache();
})();
</script>
</body></html>
